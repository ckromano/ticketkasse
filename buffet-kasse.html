<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffet-Kasse</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#1d1b18; --muted:#6f6a61; --line:#e3ddd1;
    --accent:#1d3557; --accent-ink:#fff; --gold:#e0a43a; --warn:#b4432c; --soft:#e9eef5; --food:#c2412d; --food-soft:#fff7f3;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14151a; --card:#1f2128; --ink:#f0eee8; --muted:#a29e95; --line:#33353d; --accent:#7fa6d9; --accent-ink:#0e1520; --gold:#e8b65a; --warn:#e2725a; --soft:#1e2733; --food:#e8735f; --food-soft:#2a1f1e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:520px;margin:0 auto;padding:16px 14px 120px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:12px}
  .cat{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 4px 6px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
  .item + .item{border-top:1px solid var(--line)}
  .item .nm b{display:block;font-size:16px}
  .item .nm span{color:var(--muted);font-size:14px}
  .item.has .nm b{color:var(--accent)}
  .stepper{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .stepper button{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;font-weight:600;cursor:pointer}
  .stepper button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .stepper button:active{transform:scale(.94)}
  .count{min-width:28px;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .count.zero{color:var(--muted);opacity:.5}
  .card.food{border-left:6px solid var(--food);background:var(--food-soft)}
  .card.drink{border-left:6px solid var(--accent)}
  .cat.food{color:var(--food)} .cat.drink{color:var(--accent)}
  .food .stepper button.plus{background:var(--food);border-color:var(--food);color:#fff}
  .food .item.has .nm b{color:var(--food)}
  .pay{padding:14px}
  .sub{font-size:14px;color:var(--muted);margin:0 0 8px}
  .cash{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
  .cash button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
  .given{display:flex;gap:8px}
  .given input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;padding:0 12px}
  .given button{height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:14px;cursor:pointer}
  .change{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft);display:flex;justify-content:space-between;align-items:baseline}
  .change .c-val{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .change.short{background:transparent;border:1px dashed var(--warn)}
  .change.short .c-val,.change.short .c-label{color:var(--warn)}
  .done{width:100%;height:56px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;cursor:pointer}
  .done:disabled{opacity:.4;cursor:default}
  .ghost{width:100%;min-height:44px;padding:6px 10px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--muted);font-size:15px;cursor:pointer}
  .ghost:disabled{opacity:.4;cursor:default}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .bar .lbl{color:var(--muted);font-size:13px}
  .bar .sum{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .bar .n{color:var(--muted);font-size:13px;margin-top:2px}
  .bar button{height:50px;padding:0 18px;border-radius:14px;border:none;background:var(--gold);color:#1d1b18;font-size:16px;font-weight:700;cursor:pointer}
  .bar button:disabled{opacity:.4}
  .stat-row{display:flex;justify-content:space-between;padding:7px 0;font-variant-numeric:tabular-nums}
  .stat-row + .stat-row{border-top:1px solid var(--line)}
  .stat-row span:last-child{color:var(--muted)}
  .stat-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;font-weight:700}
  .stat-total b{font-size:26px}
  .settings{display:none;padding:10px 14px}
  .settings.open{display:block}
  .settings label{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:10px;font-size:15px}
  .settings input{width:84px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;padding:0 8px;text-align:right}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;transition:.25s;pointer-events:none}
  .toast.show{transform:translateX(-50%);opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
  .modal.open{display:flex}
  .modal .box{background:var(--card);border-radius:16px;padding:18px;max-width:340px;width:100%}
  .modal .box p{margin:0 0 14px}
  .modal .btns{display:flex;gap:8px}
  .modal .btns button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer}
  .modal .btns .danger{background:var(--warn);border-color:var(--warn);color:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1>🍕 Buffet-Kasse</h1>
    <button class="icon-btn" id="toggleSettings">Preise</button>
  </header>

  <section class="card settings" id="settings"><p class="sub">Preise anpassen</p><div id="priceList"></div></section>

  <div id="menu"></div>

  <section class="card pay" id="paySec">
    <p class="sub">Erhalten (antippen zum Addieren)</p>
    <div class="cash">
      <button data-cash="5">5</button><button data-cash="10">10</button><button data-cash="20">20</button><button data-cash="50">50</button><button data-cash="100">100</button>
    </div>
    <div class="given">
      <input type="number" inputmode="decimal" id="given" placeholder="Betrag">
      <button id="exact">Passend</button>
      <button id="clearGiven">✕</button>
    </div>
    <div class="change" id="changeBox" hidden><span class="c-label" id="changeLabel">Rückgeld</span><span class="c-val" id="change">0.00</span></div>
    <button class="done" id="done" style="margin-top:12px" disabled>Verkauf abschliessen</button>
    <button class="ghost" id="reset">Bestellung leeren</button>
  </section>

  <div class="cat">Heute verkauft</div>
  <section class="card pay">
    <div id="stats"></div>
    <div class="stat-total"><span>Umsatz</span><b id="sSum">0.00</b></div>
    <button class="ghost" id="undo" disabled>↩︎ Letzten Verkauf rückgängig</button>
    <button class="ghost" id="clearDay">Tag zurücksetzen</button>
  </section>
</main>

<div class="bar"><div class="bar-in">
  <div><div class="lbl">Total</div><div class="sum" id="total">0.00</div><div class="n" id="nItems">Keine Artikel</div></div>
  <button id="toPay" disabled>Kassieren ↓</button>
</div></div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <p>Tageszählung wirklich auf 0 setzen?</p>
  <div class="btns"><button id="mNo">Abbrechen</button><button class="danger" id="mYes">Zurücksetzen</button></div>
</div></div>

<script>
(function(){
  const MENU=[
    {cat:'Specialità napoletane',food:true,items:[['pizza','Pizza al taglio','',4],['zeppola','Zeppola napoletana','',4]]},
    {cat:'Bevande analcoliche',items:[['cola','Coca-Cola / Coca-Cola Zero','5 dl',4],['acqua','Acqua minerale','5 dl',3]]},
    {cat:'Birre',items:[['moretti','Birra Moretti','33 cl',4]]},
    {cat:'Aperitivi e vini',items:[['spritz','Aperol Spritz','',8],['prosecco','Prosecco','',7],['vino','Vino bianco','',6]]},
    {cat:'Caffetteria',items:[['caffe','Caffè napoletano DOC','',3]]},
  ];
  const ITEMS=[]; MENU.forEach(c=>c.items.forEach(i=>ITEMS.push({id:i[0],name:i[1],size:i[2],price:i[3]})));
  const KEY='buffetkasse-v1';
  const _d=new Date(); const today=_d.getFullYear()+'-'+(_d.getMonth()+1)+'-'+_d.getDate();
  let st={prices:{},day:today,sold:{},sum:0,log:[]};
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) st=Object.assign(st,s);}catch(e){}
  if(!st.prices) st.prices={}; if(!st.sold) st.sold={}; if(!Array.isArray(st.log)) st.log=[];
  if(st.day!==today){st.day=today;st.sold={};st.sum=0;st.log=[];}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
  const price=id=>{const p=st.prices[id]; return typeof p==='number'?p:ITEMS.find(i=>i.id===id).price;};

  const $=id=>document.getElementById(id);
  const fmt=n=>(Math.round(n*100)/100).toFixed(2);
  let cart={}, given=0;

  // Karte aufbauen
  let h='';
  MENU.forEach(c=>{
    const k=c.food?'food':'drink'; h+='<div class="cat '+k+'">'+(c.food?'🍕 ':'🥤 ')+c.cat+'</div><section class="card '+k+'">';
    c.items.forEach(i=>{
      h+='<div class="item" id="row-'+i[0]+'"><div class="nm"><b>'+i[1]+'</b><span id="lbl-'+i[0]+'"></span></div>'+
         '<div class="stepper"><button aria-label="'+i[1]+' weniger" data-id="'+i[0]+'" data-d="-1">−</button>'+
         '<div class="count zero" id="c-'+i[0]+'">0</div>'+
         '<button class="plus" aria-label="'+i[1]+' mehr" data-id="'+i[0]+'" data-d="1">+</button></div></div>';
    });
    h+='</section>';
  });
  $('menu').innerHTML=h;
  $('priceList').innerHTML=ITEMS.map(i=>'<label>'+i.name+(i.size?' ('+i.size+')':'')+' <input type="number" inputmode="decimal" step="0.5" data-p="'+i.id+'"></label>').join('');

  const total=()=>ITEMS.reduce((s,i)=>s+(cart[i.id]||0)*price(i.id),0);
  const count=()=>ITEMS.reduce((s,i)=>s+(cart[i.id]||0),0);

  function render(){
    ITEMS.forEach(i=>{
      const n=cart[i.id]||0, c=$('c-'+i.id);
      c.textContent=n; c.classList.toggle('zero',n===0);
      $('row-'+i.id).classList.toggle('has',n>0);
      $('lbl-'+i.id).textContent=(i.size?i.size+' · ':'')+'Fr. '+fmt(price(i.id))+(n>1?'  →  '+fmt(n*price(i.id)):'');
    });
    const t=total(), n=count();
    $('total').textContent=fmt(t);
    $('nItems').textContent=n?n+(n===1?' Artikel':' Artikel'):'Keine Artikel';
    $('toPay').disabled=n===0;
    const box=$('changeBox');
    if(given>0&&t>0){
      box.hidden=false; const d=given-t;
      if(d>=0){box.classList.remove('short');$('changeLabel').textContent='Rückgeld';$('change').textContent=fmt(d);}
      else{box.classList.add('short');$('changeLabel').textContent='Fehlt noch';$('change').textContent=fmt(-d);}
    } else { box.hidden=true; box.classList.remove('short'); $('changeLabel').textContent='Rückgeld'; $('change').textContent='0.00'; }
    $('done').disabled=!(t>0&&(given===0||given>=t));
    // Statistik
    const rows=ITEMS.filter(i=>st.sold[i.id]).map(i=>'<div class="stat-row"><span>'+st.sold[i.id]+' × '+i.name+'</span><span>'+fmt(st.sold[i.id]*price(i.id))+'</span></div>');
    $('stats').innerHTML=rows.length?rows.join(''):'<p class="sub" style="margin:6px 0">Noch nichts verkauft.</p>';
    $('sSum').textContent=fmt(st.sum);
    const last=st.log[st.log.length-1], ub=$('undo');
    if(last){ub.disabled=false;const k=Object.values(last.items).reduce((a,b)=>a+b,0);ub.textContent='↩︎ Letzten Verkauf rückgängig ('+k+' Artikel · '+fmt(last.t)+')';}
    else{ub.disabled=true;ub.textContent='↩︎ Letzten Verkauf rückgängig';}
  }

  $('menu').addEventListener('click',e=>{
    const b=e.target.closest('button[data-id]'); if(!b) return;
    const id=b.dataset.id; cart[id]=Math.max(0,(cart[id]||0)+ +b.dataset.d); render();
  });
  document.querySelectorAll('[data-cash]').forEach(b=>b.addEventListener('click',()=>{given+= +b.dataset.cash;$('given').value=given;render();}));
  $('given').addEventListener('input',e=>{given=parseFloat(String(e.target.value).replace(',','.'))||0;render();});
  $('exact').addEventListener('click',()=>{given=total();$('given').value=given?fmt(given):'';render();});
  $('clearGiven').addEventListener('click',()=>{given=0;$('given').value='';render();});
  $('toPay').addEventListener('click',()=>$('paySec').scrollIntoView({behavior:'smooth',block:'start'}));

  function clearSale(){cart={};given=0;$('given').value='';render();}
  $('reset').addEventListener('click',clearSale);
  $('done').addEventListener('click',()=>{
    const t=total(), items={};
    ITEMS.forEach(i=>{if(cart[i.id]){items[i.id]=cart[i.id];st.sold[i.id]=(st.sold[i.id]||0)+cart[i.id];}});
    st.sum+=t; st.log.push({items:items,t:t}); if(st.log.length>300) st.log.shift(); save();
    toast('Verkauft: Fr. '+fmt(t)); clearSale(); window.scrollTo({top:0,behavior:'smooth'});
  });
  $('undo').addEventListener('click',()=>{
    const s=st.log.pop(); if(!s) return;
    Object.keys(s.items).forEach(id=>{st.sold[id]=Math.max(0,(st.sold[id]||0)-s.items[id]); if(!st.sold[id]) delete st.sold[id];});
    st.sum=Math.max(0,st.sum-s.t); save(); render(); toast('Rückgängig: Fr. '+fmt(s.t));
  });

  $('toggleSettings').addEventListener('click',()=>$('settings').classList.toggle('open'));
  document.querySelectorAll('[data-p]').forEach(inp=>{
    inp.value=price(inp.dataset.p);
    inp.addEventListener('input',()=>{const v=parseFloat(inp.value);if(v>=0){st.prices[inp.dataset.p]=v;save();render();}});
  });

  $('clearDay').addEventListener('click',()=>$('modal').classList.add('open'));
  $('mNo').addEventListener('click',()=>$('modal').classList.remove('open'));
  $('mYes').addEventListener('click',()=>{st.sold={};st.sum=0;st.log=[];save();render();$('modal').classList.remove('open');});

  let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
  render();
})();
</script>
</body>
</html>
